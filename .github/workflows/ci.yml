name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 定时回归（T19）：当前未启用——用户决策（2026-08-31）"目前不需要进行回归"。
  # 启用方式：取消下方两行注释即可，notify job 将自动从"仅失败告警"切换为
  # "成功发摘要 + 失败发告警"（触发条件已预留 github.event_name == 'schedule'）。
  # schedule:
  #   - cron: "0 22 * * *"   # UTC 22:00 = 北京 06:00

# 两阶段：unit 门禁（lint + format + unit）→ e2e 集成

# L17：并发组 —— 同一 ref 只保留最新一次运行。此前并发 push 会同时跑 publish（两个
# 进程同时写 gh-pages / allure-history），历史趋势互相覆盖。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: 单元测试（门禁）
    runs-on: ubuntu-latest
    # L17：此前无超时 = GitHub 默认 360 分钟；门禁卡死会白占 runner 并挂住整条流水线
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      # M14（2026-10-08 审查）：lint 之外补格式化门禁——此前只跑 ruff check，
      # 代码风格漂移无人拦（实测已漂移 1 个文件）。
      - name: Format check (ruff format)
        run: ruff format --check .

      # M14：两个 job 都用 -m 过滤，漏写 marker 的用例会同时躲过两边。
      # pytest 在"未收集到任何测试"时退出码为 5：正好用来做"无未分类测试"门禁。
      - name: 未分类测试门禁（marker 漏写检测）
        run: |
          set +e
          pytest -m "not unit and not e2e and not erp" --collect-only -q
          code=$?
          set -e
          if [ "$code" -ne 5 ]; then
            echo "::error::存在未标 unit/e2e/erp 的测试：marker 漏写会同时被两个 job 跳过"
            exit 1
          fi

      - name: Unit tests (-m unit)
        run: pytest -m unit --alluredir=allure-results

      - name: Upload unit allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-unit
          path: allure-results
          if-no-files-found: ignore

  e2e:
    name: 集成 / 端到端测试
    runs-on: ubuntu-latest
    # L17：e2e 含浏览器启动 + 自愈重试，给足 30 分钟；超时即失败，不再拖到默认 6 小时
    timeout-minutes: 30
    needs: unit # 单测门禁全绿后才运行
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          playwright install --with-deps chromium

      # T22：CI 上开启修复建议产出（settings.yaml 仅含该开关，其余字段走 pydantic 默认；
      # 本地默认关闭守"不自动乱合库"，CI 产物仅用于人工审阅）
      # M13（2026-10-08 审查）：显式声明 channel=chromium——代码默认 channel="chrome"
      # 走系统 Chrome，会让上面的 `playwright install chromium` 完全失效；
      # runner 镜像一旦不带 Chrome，报错还会与"已安装 chromium"的说法自相矛盾。
      - name: Enable fix proposals (T22 产物开关) + 固定浏览器内核 (M13)
        run: |
          printf 'browser:\n  channel: chromium\nhealing:\n  fix_proposals: true\n' > config/settings.yaml

      - name: Integration / e2e tests (-m e2e)
        run: pytest -m "e2e and not erp and not live" --trace-healing --alluredir=allure-results
        # erp 用例（T23 管伊佳 ERP）需本地被测环境，CI 排除（本地/演示环境运行）
        # L19：live 用例外呼付费模型（test_llm_smoke / test_visual_smoke），CI 不跑

      - name: Upload fix proposals (T22 草稿 PR 数据源)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fix-proposals
          path: reports/fix-proposals
          if-no-files-found: ignore

      - name: Upload e2e allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-e2e
          path: allure-results
          if-no-files-found: ignore

      - name: Upload e2e traces (Playwright Trace 回放)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traces
          path: reports/traces
          if-no-files-found: ignore

      - name: Upload self-heal dashboard (B3 运行时生成)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfheal-dashboard
          path: reports/dashboard.html
          if-no-files-found: ignore

      - name: Upload healing records (T19 通知摘要数据源)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healing-records
          path: reports/healing-records.json
          if-no-files-found: ignore

  notify:
    name: 回归通知（webhook）
    runs-on: ubuntu-latest
    # M17：needs 补 publish——此前只有 unit/e2e，publish 挂掉时 failure() 为 false 且不在
    # FAILED_JOBS 里，整条流水线变红却**没有任何告警**（2026-10-21 事故即如此）。
    needs: [unit, e2e, publish]
    # 触发范围：失败必告警（仅 main，PR 不打扰）；定时回归启用后成功也发摘要
    # （github.event_name == 'schedule' 分支已预留）。WEBHOOK_URL 未配置 → 脚本自跳过。
    if: >-
      always() &&
      (failure() || github.event_name == 'schedule') &&
      github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5

      - name: Download healing records
        uses: actions/download-artifact@v5
        with:
          name: healing-records
          path: reports
        continue-on-error: true # 摘要缺失（如 unit 阶段挂）不阻塞告警

      - name: Send notification
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          # 组装失败 job 名单（needs 结果 -> 逗号串）
          FAILED_JOBS: >-
            ${{
              needs.unit.result == 'failure' && 'unit' || ''
            }}${{
              needs.e2e.result == 'failure' && ', e2e' || ''
            }}${{
              needs.publish.result == 'failure' && ', publish' || ''
            }}
          CONCLUSION: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
        run: |
          python scripts/notify.py \
            --provider "${{ vars.NOTIFY_PROVIDER || 'dingtalk' }}" \
            --summary-file reports/healing-records.json \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --conclusion "$CONCLUSION" \
            --failed-jobs "$FAILED_JOBS"

  propose-pr:
    name: 修复建议草稿 PR（T22，人审）
    runs-on: ubuntu-latest
    needs: [unit, e2e]
    # 仅 main 成功后开草稿 PR（守 T15 人审边界：只开草稿、绝不合并）
    if: always() && needs.e2e.result == 'success' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - name: Download fix proposals
        uses: actions/download-artifact@v5
        with:
          name: fix-proposals
          path: reports/fix-proposals
        continue-on-error: true

      # 无产物（本轮无自愈成功 / 未装 key）时脚本自跳过
      - name: Skip check (no proposals)
        id: check
        run: |
          if compgen -G "reports/fix-proposals/*.json" > /dev/null; then
            echo "has_proposals=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_proposals=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit proposals to head branch
        if: steps.check.outputs.has_proposals == 'true'
        run: |
          git config user.name "selfheal-bot"
          git config user.email "selfheal-bot@users.noreply.github.com"
          git checkout -B selfheal/proposals origin/main
          git add -f reports/fix-proposals
          git commit -m "chore: 自愈修复建议产物（T22 人审清单，run ${{ github.run_id }}）" || echo "nothing to commit"
          git push --force origin selfheal/proposals

      - name: Create draft PR (dedup by label)
        if: steps.check.outputs.has_proposals == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/propose_pr.py \
            --proposals-dir reports/fix-proposals \
            --head-branch selfheal/proposals \
            --label selfheal-proposal \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  publish:
    name: 发布 Allure 报告（GitHub Pages + 历史趋势）
    runs-on: ubuntu-latest
    needs: [unit, e2e]
    # 仅 main 分支发布报告（PR 只上传 results 产物，不写 Pages）
    if: always() && github.ref == 'refs/heads/main'
    permissions:
      contents: write # peaceiris 推 gh-pages 必需——新仓库 GITHUB_TOKEN 默认 read-only，缺它 git push 即 128
    # M17：补超时（此前只有 unit/e2e 有）——下载 / 生成 / 推送任一环节卡死不再白占 runner
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # 合并 unit + e2e 两阶段 results 到同一目录（allure 单报告）
      - name: Download allure results
        uses: actions/download-artifact@v5
        with:
          pattern: allure-*
          path: allure-results
          merge-multiple: true

      # 取 gh-pages 上的历史（history/）供趋势图拼接。
      # 首次发布 gh-pages 分支尚不存在 → checkout 必失败（exit 128）：
      # continue-on-error 容错跳过（本次无历史拼接，peaceiris 会自动创建 gh-pages，下次起趋势正常）
      - name: Checkout gh-pages (history)
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      # M17（2026-11-11 修复）：此前用 Docker 类型 action simple-elf/allure-report-action@v1.15，
      # 其 Dockerfile 基础镜像 public.ecr.aws/amazoncorretto/amazoncorretto:8 拉取被上游限流
      # （HTTP 429 toomanyrequests: Data limit exceeded，退避重试 3 次全挂）→ publish 红、整条 main 流水线红。
      # 改为 runner 上直装 Allure CLI（全程无 Docker 依赖），生成逻辑与原 action 等价且更透明。
      - name: Setup Java (Allure CLI 运行时)
        # 用 node24 runtime 的 v6（Allure CLI 只要求 Java ≥ 8，temurin 17 为 LTS 基线）
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Allure CLI
        env:
          # 固定版本：latest 漂移会静默改变报告结构（原 action 的 Dockerfile 用 2.44.0，本次一并升级）；
          # 引号不可省：YAML 会把 2.46 这类两段版本静默解析成 float
          ALLURE_VERSION: "2.46.2"
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/allure.tgz" \
            "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"
          tar -xzf "$RUNNER_TEMP/allure.tgz" -C "$HOME"
          echo "$HOME/allure-${ALLURE_VERSION}/bin" >> "$GITHUB_PATH"
          # $GITHUB_PATH 只对后续 step 生效，本 step 用绝对路径校验版本
          installed="$("$HOME/allure-${ALLURE_VERSION}/bin/allure" --version)"
          [ "$installed" = "$ALLURE_VERSION" ] || { echo "::error::Allure 版本不符：$installed"; exit 1; }
          echo "Allure CLI ${installed} 就绪（$HOME/allure-${ALLURE_VERSION}/bin）"

      # M17 空结果守卫：download-artifact 的 pattern 匹配 0 个产物时**不报错**，
      # 而 allure generate 对空目录也返回 0 → 空报告会被发上线并覆盖掉 gh-pages 上的历史。
      - name: Guard empty results
        run: |
          set -euo pipefail
          count="$(find allure-results -name '*-result.json' -type f | wc -l)"
          echo "allure 结果文件：$count 个"
          if [ "$count" -eq 0 ]; then
            echo "::error::allure-results 为空（unit / e2e 产物缺失），拒绝发布空报告"
            exit 1
          fi

      # 趋势图数据源：把上一轮已发布的 history/ 播种进 results 目录（allure generate 从 results/history 读历史）。
      # 原 action 从 gh-pages/last-history 播种，而本仓库只把 allure-report 发布到 gh-pages 根
      # （history/ 在根目录），last-history 实际从未存在 → 历史趋势一直拼不上；这里改读 gh-pages/history。
      - name: Seed report history
        run: |
          set -euo pipefail
          if [ -d gh-pages/history ]; then
            mkdir -p allure-results/history
            cp -a gh-pages/history/. allure-results/history/
            echo "已继承上一轮 history：$(find allure-results/history -type f | wc -l) 个文件"
          elif git ls-remote --exit-code origin gh-pages > /dev/null 2>&1; then
            echo "::error::gh-pages 分支存在却没有 history/——播种失败会清空线上趋势，拒绝继续"
            exit 1
          else
            echo "gh-pages 分支尚不存在（首次发布）——本轮建立趋势基线"
          fi

      # 报告环境页的 Executor 信息（原 action 亦写入；用 jq 组装，避免手拼 JSON 的引号转义坑）
      - name: Write executor.json
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          owner_lc="$(printf '%s' "${REPO%%/*}" | tr '[:upper:]' '[:lower:]')"
          # 不带结尾斜杠：带了会让 history item 的 reportUrl 拼出 `//#testresult/...`
          pages_url="https://${owner_lc}.github.io/${REPO#*/}"
          jq -n \
            --arg pages "$pages_url" \
            --arg repo "$REPO" \
            --arg server "$SERVER_URL" \
            --arg run_id "$RUN_ID" \
            --arg run_number "$RUN_NUMBER" \
            --arg report_name 'AutoAiSelfHeal 自愈报告' \
            '{name: "GitHub Actions", type: "github", reportName: $report_name,
              url: $pages, reportUrl: $pages,
              buildUrl: "\($server)/\($repo)/actions/runs/\($run_id)",
              buildName: ("GitHub Actions Run #" + $run_id),
              buildOrder: $run_number}' > allure-results/executor.json
          python3 -m json.tool allure-results/executor.json > /dev/null # 校验 JSON 合法，防环境页静默错乱

      - name: Generate Allure report
        run: |
          set -euo pipefail
          allure generate allure-results -o allure-report --clean
          test -f allure-report/index.html # 生成静默失败时立即失败，不把半成品交给发布步骤

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
