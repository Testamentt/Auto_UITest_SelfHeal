name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 定时回归（T19）：当前未启用——用户决策（2026-08-31）"目前不需要进行回归"。
  # 启用方式：取消下方两行注释即可，notify job 将自动从"仅失败告警"切换为
  # "成功发摘要 + 失败发告警"（触发条件已预留 github.event_name == 'schedule'）。
  # schedule:
  #   - cron: "0 22 * * *"   # UTC 22:00 = 北京 06:00

# 两阶段（见 RULE.md R2 配套约定）：unit 门禁 → e2e 集成

jobs:
  unit:
    name: 单元测试（门禁）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests (-m unit)
        run: pytest -m unit --alluredir=allure-results

      - name: Upload unit allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-unit
          path: allure-results
          if-no-files-found: ignore

  e2e:
    name: 集成 / 端到端测试
    runs-on: ubuntu-latest
    needs: unit # 单测门禁全绿后才运行
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          playwright install --with-deps chromium

      # T22：CI 上开启修复建议产出（settings.yaml 仅含该开关，其余字段走 pydantic 默认；
      # 本地默认关闭守"不自动乱合库"，CI 产物仅用于人工审阅）
      - name: Enable fix proposals (T22 产物开关)
        run: |
          printf 'healing:\n  fix_proposals: true\n' > config/settings.yaml

      - name: Integration / e2e tests (-m e2e)
        run: pytest -m "e2e and not erp" --trace-healing --alluredir=allure-results
        # erp 用例（T23 管伊佳 ERP）需本地被测环境，CI 排除（本地/演示环境运行）

      - name: Upload fix proposals (T22 草稿 PR 数据源)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fix-proposals
          path: reports/fix-proposals
          if-no-files-found: ignore

      - name: Upload e2e allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-e2e
          path: allure-results
          if-no-files-found: ignore

      - name: Upload e2e traces (Playwright Trace 回放)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traces
          path: reports/traces
          if-no-files-found: ignore

      - name: Upload self-heal dashboard (B3 运行时生成)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfheal-dashboard
          path: reports/dashboard.html
          if-no-files-found: ignore

      - name: Upload healing records (T19 通知摘要数据源)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healing-records
          path: reports/healing-records.json
          if-no-files-found: ignore

  notify:
    name: 回归通知（webhook）
    runs-on: ubuntu-latest
    needs: [unit, e2e]
    # 触发范围：失败必告警（仅 main，PR 不打扰）；定时回归启用后成功也发摘要
    # （github.event_name == 'schedule' 分支已预留）。WEBHOOK_URL 未配置 → 脚本自跳过。
    if: >-
      always() &&
      (failure() || github.event_name == 'schedule') &&
      github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Download healing records
        uses: actions/download-artifact@v4
        with:
          name: healing-records
          path: reports
        continue-on-error: true # 摘要缺失（如 unit 阶段挂）不阻塞告警

      - name: Send notification
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          # 组装失败 job 名单（needs 结果 -> 逗号串）
          FAILED_JOBS: >-
            ${{
              needs.unit.result == 'failure' && 'unit' || ''
            }}${{
              needs.e2e.result == 'failure' && ', e2e' || ''
            }}
          CONCLUSION: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
        run: |
          python scripts/notify.py \
            --provider "${{ vars.NOTIFY_PROVIDER || 'dingtalk' }}" \
            --summary-file reports/healing-records.json \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --conclusion "$CONCLUSION" \
            --failed-jobs "$FAILED_JOBS"

  propose-pr:
    name: 修复建议草稿 PR（T22，人审）
    runs-on: ubuntu-latest
    needs: [unit, e2e]
    # 仅 main 成功后开草稿 PR（守 T15 人审边界：只开草稿、绝不合并）
    if: always() && needs.e2e.result == 'success' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Download fix proposals
        uses: actions/download-artifact@v4
        with:
          name: fix-proposals
          path: reports/fix-proposals
        continue-on-error: true

      # 无产物（本轮无自愈成功 / 未装 key）时脚本自跳过
      - name: Skip check (no proposals)
        id: check
        run: |
          if compgen -G "reports/fix-proposals/*.json" > /dev/null; then
            echo "has_proposals=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_proposals=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit proposals to head branch
        if: steps.check.outputs.has_proposals == 'true'
        run: |
          git config user.name "selfheal-bot"
          git config user.email "selfheal-bot@users.noreply.github.com"
          git checkout -B selfheal/proposals origin/main
          git add -f reports/fix-proposals
          git commit -m "chore: 自愈修复建议产物（T22 人审清单，run ${{ github.run_id }}）" || echo "nothing to commit"
          git push --force origin selfheal/proposals

      - name: Create draft PR (dedup by label)
        if: steps.check.outputs.has_proposals == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/propose_pr.py \
            --proposals-dir reports/fix-proposals \
            --head-branch selfheal/proposals \
            --label selfheal-proposal \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  publish:
    name: 发布 Allure 报告（GitHub Pages + 历史趋势）
    runs-on: ubuntu-latest
    needs: [unit, e2e]
    # 仅 main 分支发布报告（PR 只上传 results 产物，不写 Pages）
    if: always() && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      # 合并 unit + e2e 两阶段 results 到同一目录（allure 单报告）
      - name: Download allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-*
          path: allure-results
          merge-multiple: true

      # 取 gh-pages 上的历史（allure-history）供趋势图拼接（T18：分支需先存在）
      - name: Checkout gh-pages (history)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure report
        uses: simple-elf/allure-report-action@master
        id: allure
        with:
          allure_results: allure-results
          allure_history: allure-history
          allure_report: allure-report
          gh_pages: gh-pages

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
