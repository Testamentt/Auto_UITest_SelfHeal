name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 定时回归（T19）：当前未启用——用户决策（2026-08-31）"目前不需要进行回归"。
  # 启用方式：取消下方两行注释即可，notify job 将自动从"仅失败告警"切换为
  # "成功发摘要 + 失败发告警"（触发条件已预留 github.event_name == 'schedule'）。
  # schedule:
  #   - cron: "0 22 * * *"   # UTC 22:00 = 北京 06:00

# 两阶段（见 RULE.md R2 配套约定）：unit 门禁 → e2e 集成

jobs:
  unit:
    name: 单元测试（门禁）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests (-m unit)
        run: pytest -m unit --alluredir=allure-results

      - name: Upload unit allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-unit
          path: allure-results
          if-no-files-found: ignore

  e2e:
    name: 集成 / 端到端测试
    runs-on: ubuntu-latest
    needs: unit # 单测门禁全绿后才运行
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          playwright install --with-deps chromium

      - name: Integration / e2e tests (-m e2e)
        run: pytest -m e2e --trace-healing --alluredir=allure-results

      - name: Upload e2e allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-e2e
          path: allure-results
          if-no-files-found: ignore

      - name: Upload e2e traces (Playwright Trace 回放)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traces
          path: reports/traces
          if-no-files-found: ignore

      - name: Upload self-heal dashboard (B3 运行时生成)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfheal-dashboard
          path: reports/dashboard.html
          if-no-files-found: ignore

      - name: Upload healing records (T19 通知摘要数据源)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healing-records
          path: reports/healing-records.json
          if-no-files-found: ignore

  notify:
    name: 回归通知（webhook）
    runs-on: ubuntu-latest
    needs: [unit, e2e]
    # 触发范围：失败必告警（仅 main，PR 不打扰）；定时回归启用后成功也发摘要
    # （github.event_name == 'schedule' 分支已预留）。WEBHOOK_URL 未配置 → 脚本自跳过。
    if: >-
      always() &&
      (failure() || github.event_name == 'schedule') &&
      github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Download healing records
        uses: actions/download-artifact@v4
        with:
          name: healing-records
          path: reports
        continue-on-error: true # 摘要缺失（如 unit 阶段挂）不阻塞告警

      - name: Send notification
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          # 组装失败 job 名单（needs 结果 -> 逗号串）
          FAILED_JOBS: >-
            ${{
              needs.unit.result == 'failure' && 'unit' || ''
            }}${{
              needs.e2e.result == 'failure' && ', e2e' || ''
            }}
          CONCLUSION: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
        run: |
          python scripts/notify.py \
            --provider "${{ vars.NOTIFY_PROVIDER || 'dingtalk' }}" \
            --summary-file reports/healing-records.json \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --conclusion "$CONCLUSION" \
            --failed-jobs "$FAILED_JOBS"

  publish:
    name: 发布 Allure 报告（GitHub Pages + 历史趋势）
    runs-on: ubuntu-latest
    needs: [unit, e2e]
    # 仅 main 分支发布报告（PR 只上传 results 产物，不写 Pages）
    if: always() && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      # 合并 unit + e2e 两阶段 results 到同一目录（allure 单报告）
      - name: Download allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-*
          path: allure-results
          merge-multiple: true

      # 取 gh-pages 上的历史（allure-history）供趋势图拼接（T18：分支需先存在）
      - name: Checkout gh-pages (history)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure report
        uses: simple-elf/allure-report-action@master
        id: allure
        with:
          allure_results: allure-results
          allure_history: allure-history
          allure_report: allure-report
          gh_pages: gh-pages

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
