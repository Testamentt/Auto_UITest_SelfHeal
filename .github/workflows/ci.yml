name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 瀹氭椂鍥炲綊锛圱19锛夛細褰撳墠鏈惎鐢ㄢ€斺€旂敤鎴峰喅绛栵紙2026-08-31锛?鐩墠涓嶉渶瑕佽繘琛屽洖褰?銆?
  # 鍚敤鏂瑰紡锛氬彇娑堜笅鏂逛袱琛屾敞閲婂嵆鍙紝notify job 灏嗚嚜鍔ㄤ粠"浠呭け璐ュ憡璀?鍒囨崲涓?
  # "鎴愬姛鍙戞憳瑕?+ 澶辫触鍙戝憡璀?锛堣Е鍙戞潯浠跺凡棰勭暀 github.event_name == 'schedule'锛夈€?
  # schedule:
  #   - cron: "0 22 * * *"   # UTC 22:00 = 鍖椾含 06:00

# 涓ら樁娈碉紙瑙?RULE.md R2 閰嶅绾﹀畾锛夛細unit 闂ㄧ 鈫?e2e 闆嗘垚

jobs:
  unit:
    name: 鍗曞厓娴嬭瘯锛堥棬绂侊級
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests (-m unit)
        run: pytest -m unit --alluredir=allure-results

      - name: Upload unit allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-unit
          path: allure-results
          if-no-files-found: ignore

  e2e:
    name: 闆嗘垚 / 绔埌绔祴璇?
    runs-on: ubuntu-latest
    needs: unit # 鍗曟祴闂ㄧ鍏ㄧ豢鍚庢墠杩愯
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          playwright install --with-deps chromium

      # T22锛欳I 涓婂紑鍚慨澶嶅缓璁骇鍑猴紙settings.yaml 浠呭惈璇ュ紑鍏筹紝鍏朵綑瀛楁璧?pydantic 榛樿锛?
      # 鏈湴榛樿鍏抽棴瀹?涓嶈嚜鍔ㄤ贡鍚堝簱"锛孋I 浜х墿浠呯敤浜庝汉宸ュ闃咃級
      - name: Enable fix proposals (T22 浜х墿寮€鍏?
        run: |
          printf 'healing:\n  fix_proposals: true\n' > config/settings.yaml

      - name: Integration / e2e tests (-m e2e)
        run: pytest -m "e2e and not erp" --trace-healing --alluredir=allure-results
        # erp 鐢ㄤ緥锛圱23 绠′紛浣?ERP锛夐渶鏈湴琚祴鐜锛孋I 鎺掗櫎锛堟湰鍦?婕旂ず鐜杩愯锛?

      - name: Upload fix proposals (T22 鑽夌 PR 鏁版嵁婧?
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fix-proposals
          path: reports/fix-proposals
          if-no-files-found: ignore

      - name: Upload e2e allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-e2e
          path: allure-results
          if-no-files-found: ignore

      - name: Upload e2e traces (Playwright Trace 鍥炴斁)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traces
          path: reports/traces
          if-no-files-found: ignore

      - name: Upload self-heal dashboard (B3 杩愯鏃剁敓鎴?
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfheal-dashboard
          path: reports/dashboard.html
          if-no-files-found: ignore

      - name: Upload healing records (T19 閫氱煡鎽樿鏁版嵁婧?
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healing-records
          path: reports/healing-records.json
          if-no-files-found: ignore

  notify:
    name: 鍥炲綊閫氱煡锛坵ebhook锛?
    runs-on: ubuntu-latest
    needs: [unit, e2e]
    # 瑙﹀彂鑼冨洿锛氬け璐ュ繀鍛婅锛堜粎 main锛孭R 涓嶆墦鎵帮級锛涘畾鏃跺洖褰掑惎鐢ㄥ悗鎴愬姛涔熷彂鎽樿
    # 锛坓ithub.event_name == 'schedule' 鍒嗘敮宸查鐣欙級銆俉EBHOOK_URL 鏈厤缃?鈫?鑴氭湰鑷烦杩囥€?
    if: >-
      always() &&
      (failure() || github.event_name == 'schedule') &&
      github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5

      - name: Download healing records
        uses: actions/download-artifact@v5
        with:
          name: healing-records
          path: reports
        continue-on-error: true # 鎽樿缂哄け锛堝 unit 闃舵鎸傦級涓嶉樆濉炲憡璀?

      - name: Send notification
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          # 缁勮澶辫触 job 鍚嶅崟锛坣eeds 缁撴灉 -> 閫楀彿涓诧級
          FAILED_JOBS: >-
            ${{
              needs.unit.result == 'failure' && 'unit' || ''
            }}${{
              needs.e2e.result == 'failure' && ', e2e' || ''
            }}
          CONCLUSION: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
        run: |
          python scripts/notify.py \
            --provider "${{ vars.NOTIFY_PROVIDER || 'dingtalk' }}" \
            --summary-file reports/healing-records.json \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --conclusion "$CONCLUSION" \
            --failed-jobs "$FAILED_JOBS"

  propose-pr:
    name: 淇寤鸿鑽夌 PR锛圱22锛屼汉瀹★級
    runs-on: ubuntu-latest
    needs: [unit, e2e]
    # 浠?main 鎴愬姛鍚庡紑鑽夌 PR锛堝畧 T15 浜哄杈圭晫锛氬彧寮€鑽夌銆佺粷涓嶅悎骞讹級
    if: always() && needs.e2e.result == 'success' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - name: Download fix proposals
        uses: actions/download-artifact@v5
        with:
          name: fix-proposals
          path: reports/fix-proposals
        continue-on-error: true

      # 鏃犱骇鐗╋紙鏈疆鏃犺嚜鎰堟垚鍔?/ 鏈 key锛夋椂鑴氭湰鑷烦杩?
      - name: Skip check (no proposals)
        id: check
        run: |
          if compgen -G "reports/fix-proposals/*.json" > /dev/null; then
            echo "has_proposals=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_proposals=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit proposals to head branch
        if: steps.check.outputs.has_proposals == 'true'
        run: |
          git config user.name "selfheal-bot"
          git config user.email "selfheal-bot@users.noreply.github.com"
          git checkout -B selfheal/proposals origin/main
          git add -f reports/fix-proposals
          git commit -m "chore: 鑷剤淇寤鸿浜х墿锛圱22 浜哄娓呭崟锛宺un ${{ github.run_id }}锛? || echo "nothing to commit"
          git push --force origin selfheal/proposals

      - name: Create draft PR (dedup by label)
        if: steps.check.outputs.has_proposals == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/propose_pr.py \
            --proposals-dir reports/fix-proposals \
            --head-branch selfheal/proposals \
            --label selfheal-proposal \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  publish:
    name: 鍙戝竷 Allure 鎶ュ憡锛圙itHub Pages + 鍘嗗彶瓒嬪娍锛?
    runs-on: ubuntu-latest
    needs: [unit, e2e]
    # 浠?main 鍒嗘敮鍙戝竷鎶ュ憡锛圥R 鍙笂浼?results 浜х墿锛屼笉鍐?Pages锛?
    if: always() && github.ref == 'refs/heads/main'
    permissions:
      contents: write # peaceiris 鎺?gh-pages 蹇呴渶鈥斺€旀柊浠撳簱 GITHUB_TOKEN 榛樿 read-only锛岀己瀹?git push 鍗?128
    steps:
      - uses: actions/checkout@v5

      # 鍚堝苟 unit + e2e 涓ら樁娈?results 鍒板悓涓€鐩綍锛坅llure 鍗曟姤鍛婏級
      - name: Download allure results
        uses: actions/download-artifact@v5
        with:
          pattern: allure-*
          path: allure-results
          merge-multiple: true

      # 鍙?gh-pages 涓婄殑鍘嗗彶锛坅llure-history锛変緵瓒嬪娍鍥炬嫾鎺ャ€?
      # 棣栨鍙戝竷 gh-pages 鍒嗘敮灏氫笉瀛樺湪 鈫?checkout 蹇呭け璐ワ紙exit 128锛夛細
      # continue-on-error 瀹归敊璺宠繃锛堟湰娆℃棤鍘嗗彶鎷兼帴锛宲eaceiris 浼氳嚜鍔ㄥ垱寤?gh-pages锛屼笅娆¤捣瓒嬪娍姝ｅ父锛?
      - name: Checkout gh-pages (history)
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Generate Allure report
        uses: simple-elf/allure-report-action@master
        id: allure
        with:
          allure_results: allure-results
          allure_history: allure-history
          allure_report: allure-report
          gh_pages: gh-pages

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
