name: CI

on:
  push:
    branches: [main]
  pull_request:

# 两阶段（见 RULE.md R2 配套约定）：unit 门禁 → e2e 集成

jobs:
  unit:
    name: 单元测试（门禁）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests (-m unit)
        run: pytest -m unit --alluredir=allure-results

      - name: Upload unit allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-unit
          path: allure-results
          if-no-files-found: ignore

  e2e:
    name: 集成 / 端到端测试
    runs-on: ubuntu-latest
    needs: unit # 单测门禁全绿后才运行
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          playwright install --with-deps chromium

      - name: Integration / e2e tests (-m e2e)
        run: pytest -m e2e --trace-healing --alluredir=allure-results

      - name: Upload e2e allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-e2e
          path: allure-results
          if-no-files-found: ignore

      - name: Upload e2e traces (Playwright Trace 回放)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traces
          path: reports/traces
          if-no-files-found: ignore

      - name: Upload self-heal dashboard (B3 运行时生成)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfheal-dashboard
          path: reports/dashboard.html
          if-no-files-found: ignore

  publish:
    name: 发布 Allure 报告（GitHub Pages + 历史趋势）
    runs-on: ubuntu-latest
    needs: [unit, e2e]
    # 仅 main 分支发布报告（PR 只上传 results 产物，不写 Pages）
    if: always() && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      # 合并 unit + e2e 两阶段 results 到同一目录（allure 单报告）
      - name: Download allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-*
          path: allure-results
          merge-multiple: true

      # 取 gh-pages 上的历史（allure-history）供趋势图拼接（T18：分支需先存在）
      - name: Checkout gh-pages (history)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure report
        uses: simple-elf/allure-report-action@master
        id: allure
        with:
          allure_results: allure-results
          allure_history: allure-history
          allure_report: allure-report
          gh_pages: gh-pages

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
