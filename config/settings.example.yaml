# 运行时配置示例。复制为 config/settings.yaml 后填写真实值（settings.yaml 已被 .gitignore 忽略）。
# 所有配置经由 src/selfheal/config.py 用 pydantic 加载校验，请勿在代码中直接读取环境变量。

browser:
  headless: true
  channel: chrome          # chrome=系统已装 Chrome（免下载内核）/ chromium=Playwright 自带内核
  slow_mo: 0               # 毫秒，演示时可适当调大
  viewport: { width: 1280, height: 800 }
  trace: false             # 录制 Playwright trace（Phase 4 视频回放选型）；用 playwright show-trace 回放
  trace_dir: reports/traces

# LLM（已定选型，见 docs/architecture.md「已定选型」）：DeepSeek OpenAI 兼容端点
llm:
  enabled: true             # 模型能力总开关；False 或缺少 API key 时诊断退规则式、语义策略被跳过
  provider: openai
  model: deepseek-v4-flash
  api_key_env: OPENAI_API_KEY   # 从环境变量名读取密钥，勿写明文
  base_url: https://api.deepseek.com
  temperature: 0.0

# VLM（已定选型）：通义 qwen3-vl-flash，DashScope OpenAI 兼容端点
vision:
  enabled: true             # 视觉能力总开关；False 或缺少 key 时视觉策略被跳过
  provider: openai
  model: qwen3-vl-flash
  api_key_env: DASHSCOPE_API_KEY   # 从环境变量名读取密钥，勿写明文
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1

healing:
  enabled: true            # 插件总开关；false 时透传为原生 Playwright 行为
  # 策略调度顺序（可插拔，见 agent/strategies/）
  strategy_order: [heuristic, semantic, visual]
  knowledge_first: true    # 调用 LLM 前先查知识库
  confidence_threshold: 0.6
  early_accept_threshold: 0.85   # T1 策略短路：达此置信度即采纳，不再试更贵策略（应 > confidence_threshold）
  llm_diagnose_threshold: 0.75   # C7：成功修复置信度低于此值补一次 LLM 归因（应 > confidence_threshold）
  # T5 按策略阈值：键为策略名，缺省回退上方全局阈值；同一策略 early 须 > accept
  strategy_thresholds: {}        # 例: {heuristic: 0.6, semantic: 0.65, visual: 0.7}
  strategy_early_accept: {}      # 例: {heuristic: 0.85, visual: 0.9}
  # T5 置信度归一化：对自报型（LLM 语义自报段）做保守收缩（raw²），默认关闭——
  # 待真实模型标定数据沉淀后再启用（见 src/selfheal/agent/confidence.py）
  shrink_self_reported: false
  on_uncertain: use_fallback   # use_fallback | pause | fail（见 RULE.md 决策 D6）
  # T13 高风险页豁免：URL 匹配任一 glob 则不触发自愈（支付/强授权/审计类页面误改代价高）
  exclude_url_patterns: []   # 例: ["*://*/pay*", "*://*/admin/*"]
  # T14 dry-run：仅报告不执行——只生成修复建议，不换定位器重试、不持久化知识
  dry_run: false
  # T15 修复写回人审清单：成功后输出「原→新」PR 化建议（不自动改库），人确认后合入
  fix_proposals: false

knowledge:
  backend: sqlite          # sqlite=持久化（默认）/ memory=进程内
  path: .cache/knowledge.db

# T6 动作前置智能等待：动作（click/fill 等）执行前先做一次短稳等待，
# 缓解"元素正在加载/抖动就执行动作"的误报超时。默认关闭=保持 POM 显式调用
# wait_until_stable 的既有行为（决策 D12）；best-effort，等待失败不阻塞动作。
action_wait:
  enabled: false
  timeout_ms: 2000           # 短稳等待总超时（毫秒）
  stable_ms: 300             # 元素 bounding_box 需保持不变的时长（毫秒）

# 本地确定性 Embedding（知识库语义化 A）：n-gram，零网络/零费用/<10ms；v2 fastembed 见文档
embedding:
  enabled: true
  method: ngram
  dim: 512

# T23 被测系统（管伊佳 ERP）：UI 测试目标为前端；后端 API 仅用于测试数据造数/清理（非被测对象）。
# 凭证经 *_env 指定的环境变量读取（.env 配 ERP_USERNAME/ERP_PASSWORD = 租户账号，
# 明文绝不入库）；被测环境需关闭登录验证码。
# 角色语义：租户 = 业务数据管理员（UI 测试与 API 造数共用其凭证，如测试租户 jsh）；
# admin = 平台运维用户（仅平台菜单配置/创建租户，不能编辑业务数据，测试基建不使用）。
sut:
  name: jshERP
  base_url: http://localhost:3001            # 前端（Vue3 + Ant Design Vue）
  api_base_url: http://192.168.1.3:9999/jshERP-boot   # 后端（Spring Boot）
  username_env: ERP_USERNAME                 # 租户账号（UI 登录 + API 造数共用）
  password_env: ERP_PASSWORD

# execution / reporting 段：规划中（见 docs/TODO.md T9），Settings 尚未建模，
# 请勿在此添加相关键（Settings 已设 extra='forbid'，未建模字段会导致加载报错）。
